[package]
name = "idevice-wasm"
version = "0.1.0"
edition = "2021"
description = "WebUSB + WASM: Apple mux, lockdownd cleartext + TLS (pair-record PEM)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-recursion = "1.1"
base64 = "0.22"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
idevice-usb-core = { path = "../idevice-usb-core" }
js-sys = "0.3"
pem = "3"
plist = "1"
# `getrandom/js` transitively powers `rand::thread_rng()` in the browser for rcgen / rsa RNG.
rand = "0.8"
# Same cert chain shape as `idevice::crypto` (pymobiledevice3-style host / root / device leaves).
rcgen = { version = "0.12", features = ["x509-parser"] }
# Browser wasm: ring needs this feature so `SystemRandom: SecureRandom` (see rustls#1748).
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
# `wasm-bindgen` feature routes `OffsetDateTime::now_utc()` through `js_sys::Date::now()` on
# `wasm32-unknown-unknown`. Without it the cert-validity-window helper panics with
# `time not implemented on this platform` when generating a fresh host/device chain in the
# browser (rcgen needs `NotBefore` / `NotAfter`, and we set both via `OffsetDateTime::now_utc()`
# to match the native crypto module → pymobiledevice3-shaped certs).
time = { version = "0.3", features = ["macros", "wasm-bindgen"] }
# `web` enables `UnixTime::now()` on wasm32-unknown-unknown (via web-time); required for rustls ticketer.
rustls-pki-types = { version = "1.14", features = ["std", "alloc", "web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Navigator",
    "Usb",
    "UsbAlternateInterface",
    "UsbConfiguration",
    "UsbDevice",
    "UsbDeviceFilter",
    "UsbDeviceRequestOptions",
    "UsbDirection",
    "UsbEndpoint",
    "UsbEndpointType",
    "UsbInTransferResult",
    "UsbInterface",
    "UsbOutTransferResult",
    "Window",
] }
